<title>Charyapada Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONT_URL}}">
<style>
{{CSS}}
</style>
<header class="bar">
  <div class="bar__in">
    <p class="brand"><span lang="bn" class="brand__bn">চর্যাপদ</span> <span class="brand__en">Workshop</span></p>
    <nav class="songs" id="songs" aria-label="Songs"></nav>
    <nav class="views" id="views" aria-label="Views"></nav>
  </div>
</header>
<div class="wrap">
  <section id="write" class="view" aria-label="Write">
    <div class="how" id="how"></div>
    <div class="desk">
      <section class="stage" id="stage" aria-label="The couplet you are writing"></section>
      <aside class="poem" id="poem" aria-label="Your poem"></aside>
    </div>
  </section>
  <section id="shelf" class="view" aria-labelledby="shelf-h" hidden></section>
  <section id="guide" class="view" aria-labelledby="guide-h" hidden></section>
  <footer class="foot">
    <p>Source: Haraprasad Shastri's 1916 edition of the Nepal manuscript, from the Illuminated Translations engine. Poems made here return to the edition with <code>versions import</code>. The reading method is Timothy Morton's, from his course <i>How to Read a Poem</i>.</p>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
{{JS}}
</script>
